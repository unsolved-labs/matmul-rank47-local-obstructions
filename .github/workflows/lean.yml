name: Lean formal verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore frozen inputs and generate core Lean data
        run: |
          set -euo pipefail
          python3 formal/export_frozen_inputs.py
          python3 formal/generate_lean_data.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Verify exact pins
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.32.0"
          lake env lean --version
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = \
            "81a5d257c8e410db227a6665ed08f64fea08e997"
      - name: Compile soundness core before proof-plan generation
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          lake build R006.F3CertificateSoundness
          lake build R006.Mod4Lift
          lake build R006.F3PlanSoundness
      - name: Generate untrusted complete F3 proof plan
        run: |
          set -euo pipefail
          python3 formal/generate_f3_plan.py
          python3 formal/generate_f3_plan_lean.py
      - name: Upload formalization input / plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: r006-formal-inputs
          path: |
            formal_inputs/
            R006/GeneratedData.lean
            R006/GeneratedF3Plan.lean
          if-no-files-found: error
      - name: Build full formalization and trust-zero axiom audit
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          lake build R006
          lake env lean --trust=0 R006/Audit.lean 2>&1 | tee lean-axioms.log
      - name: Reject proof bypasses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          sources = [pathlib.Path('R006.lean'), *sorted(pathlib.Path('R006').rglob('*.lean'))]
          pattern = re.compile(r'\b(?:sorry|admit|native_decide)\b|debug\.skipKernelTC|Lean\.ofReduceBool|Lean\.trustCompiler|^\s*(?:axiom|opaque|unsafe|extern|partial)\b|^\s*@\[implemented_by')
          hits=[]
          for path in sources:
              for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if pattern.search(line): hits.append(f'{path}:{n}:{line}')
          if hits:
              print('\n'.join(hits)); sys.exit(1)
          print(f'No production proof bypasses in {len(sources)} Lean files.')
          PY
