name: Verify R006
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'R006/**'
      - 'R006.lean'
      - 'formal/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

concurrency:
  group: r006-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax-check verification sources
        run: |
          bash -n verify_release.sh
          python3 -m py_compile mod4/*.py f3/*.py
          g++ -std=c++20 -fopenmp -Wall -Wextra -Werror -Wno-comment -fsyntax-only f3/independent_distance2_check.cpp
      - name: Replay exact certificates and independent complete distance-two sweeps
        run: ./verify_release.sh

  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Build manuscript twice
        run: make -C manuscript
      - name: Check manuscript output
        run: test -s manuscript/r006_local_obstructions.pdf
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: r006-manuscript
          path: manuscript/r006_local_obstructions.pdf
          if-no-files-found: error
