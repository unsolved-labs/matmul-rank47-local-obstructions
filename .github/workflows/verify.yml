name: Verify R006
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check verification sources
        run: |
          bash -n verify_release.sh
          python3 -m py_compile mod4/*.py f3/*.py
      - name: Replay exact certificates and complete distance-two sweep
        run: ./verify_release.sh
